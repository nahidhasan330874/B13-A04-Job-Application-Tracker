<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Job Application Tracker</title>

    <!-- Use daisyUI from CDN -->
    <link
      href="https://cdn.jsdelivr.net/npm/daisyui@5"
      rel="stylesheet"
      type="text/css"
    />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

    <!-- google font -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Geist:wght@100..900&display=swap"
      rel="stylesheet"
    />
  </head>
  <body class="bg-base-300">
    <header class="w-[80%] mx-auto">
      <h1 class="text-3xl font-bold pt-10 pb-5 text-[#002C5C]">
        Job Application Tracker
      </h1>
      <div class="grid grid-cols-3 gap-8 pb-5 border-b-1 border-[#E6E7E9]">
        <div class="bg-base-100 p-4 rounded-xl">
          <p class="">Total</p>
          <p id="total" class="text-[#002C5C] font-bold">0</p>
        </div>

        <div class="bg-base-100 p-4 rounded-xl">
          <p class="">Interview </p>
          <p id="total" class="text-[#10B981] font-bold">0</p>
        </div>
        <div class="bg-base-100 p-4 rounded-xl">
          <p class=""> Rejected</p>
          <p id="total" class="text-[#EF4444] font-bold">0</p>
        </div>
      </div>
    </header>
  </body>
</html>
